<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendors - LPG POS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div>
            <h1 id="company-name">LPG POS</h1>
            <p>Vendor Management</p>
        </div>

    </header>


    <div class="container">

        <aside class="sidebar">

            <button class="menu-button" onclick="window.location.href='index.html'">
                Dashboard
            </button>

            <button class="menu-button" onclick="window.location.href='sales.html'">
                POS / Sales
            </button>

            <button class="menu-button" onclick="window.location.href='customers.html'">
                Customers
            </button>

            <button class="menu-button active">
                Vendors
            </button>

            <button class="menu-button" onclick="window.location.href='product.html'">
                Products
            </button>

            <button class="menu-button" onclick="window.location.href='purchases.html'">
                Purchases
            </button>

            <button class="menu-button" onclick="window.location.href='invoices.html'">
                Invoices
            </button>

            <button class="menu-button" onclick="window.location.href='returns.html'">
                Returns
            </button>

            <button class="menu-button" onclick="window.location.href='reports.html'">
                Reports
            </button>

            <button class="menu-button" onclick="window.location.href='settings.html'">
                Settings
            </button>

            <button class="menu-button" onclick="window.location.href='user.html'">
                Users
            </button>

            <button class="menu-button" onclick="window.location.href='logout.html'">
                Logout
            </button>

        </aside>


        <main class="main-content">

            <div class="page-header">

                <div>

                    <h2>Vendor Management</h2>

                    <p>
                        Register and manage your LPG suppliers.
                    </p>

                </div>

                <button class="btn-primary" id="new-vendor-btn">
                    + Register New Vendor
                </button>

            </div>


            <!-- VENDOR FORM -->

            <section class="card" id="vendor-form-card" style="display:none;">

                <h2>Register New Vendor</h2>

                <form id="vendor-form">

                    <div class="form-row">

                        <div class="form-group">

                            <label for="vendor-name">
                                Vendor / Company Name
                            </label>

                            <input type="text" id="vendor-name" placeholder="Enter vendor name" required>

                        </div>


                        <div class="form-group">

                            <label for="vendor-contact">
                                Contact Person
                            </label>

                            <input type="text" id="vendor-contact" placeholder="Contact person" required>

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="vendor-phone">
                                Phone Number
                            </label>

                            <input type="tel" id="vendor-phone" placeholder="Phone number" required>

                        </div>


                        <div class="form-group">

                            <label for="vendor-email">
                                Email
                            </label>

                            <input type="email" id="vendor-email" placeholder="Email address">

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="vendor-address">
                                Address
                            </label>

                            <input type="text" id="vendor-address" placeholder="Vendor address">

                        </div>


                        <div class="form-group">

                            <label for="vendor-product">
                                Supply Type
                            </label>

                            <select id="vendor-product">

                                <option value="LPG">
                                    LPG
                                </option>

                                <option value="Gas Cylinders">
                                    Gas Cylinders
                                </option>

                                <option value="Accessories">
                                    Accessories
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="form-actions">

                        <button type="submit" class="btn-primary">
                            Save Vendor
                        </button>

                        <button type="button" class="btn-secondary" id="cancel-vendor-btn" data-input-forbidden>
                            Cancel
                        </button>

                    </div>

                </form>

            </section>


            <!-- VENDOR TABLE -->

            <section class="recent-sales">

                <h2>Vendor Records</h2>

                <div class="table-container seller-sheet-container">
                    <table class="pos-data-table seller-sheet vendor-sheet">


                        <thead>

                            <tr>

                                <th>Vendor ID</th>
                                <th>Vendor Name</th>
                                <th>Contact Person</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Supply Type</th>
                                <th>Address</th>
                                <th>Date</th>
                                <th>Action</th>

                            </tr>

                        </thead>


                        <tbody id="vendors-body">

                            <tr>

                                <td colspan="9" style="text-align:center; padding:30px;">

                                    No vendors registered yet.

                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>

            </section>

        </main>

    </div>


    <script src="script.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                // ==================================
                // COMPANY NAME
                // ==================================

                const settings =
                    POS.getSettings();

                document.getElementById(
                    "company-name"
                ).textContent =
                    settings.businessName ||
                    "LPG POS";


                // ==================================
                // ELEMENTS
                // ==================================

                const newVendorButton =
                    document.getElementById(
                        "new-vendor-btn"
                    );

                const formCard =
                    document.getElementById(
                        "vendor-form-card"
                    );

                const cancelButton =
                    document.getElementById(
                        "cancel-vendor-btn"
                    );

                const form =
                    document.getElementById(
                        "vendor-form"
                    );


                // ==================================
                // OPEN FORM
                // ==================================

                newVendorButton.addEventListener(
                    "click",
                    function () {

                        formCard.style.display =
                            "block";

                        newVendorButton.style.display =
                            "none";

                    }
                );


                // ==================================
                // CLOSE FORM
                // ==================================

                cancelButton.addEventListener(
                    "click",
                    function () {

                        form.reset();

                        formCard.style.display =
                            "none";

                        newVendorButton.style.display =
                            "inline-block";

                    }
                );


                // ==================================
                // DISPLAY VENDORS
                // ==================================

                function displayVendors() {

                    const vendors =
                        POS.getData("vendors");

                    const body =
                        document.getElementById(
                            "vendors-body"
                        );


                    body.innerHTML = "";


                    if (vendors.length === 0) {

                        body.innerHTML = `

                    <tr>

                        <td
                            colspan="9"
                            style="text-align:center; padding:30px;">

                            No vendors registered yet.

                        </td>

                    </tr>

                `;

                        return;

                    }


                    vendors.forEach(
                        vendor => {

                            const row =
                                document.createElement(
                                    "tr"
                                );


                            row.innerHTML = `

                        <td>
                            ${POS.escapeHTML(
                                vendor.id
                            )}
                        </td>

                        <td>
                            ${POS.escapeHTML(
                                vendor.name
                            )}
                        </td>

                        <td>
                            ${POS.escapeHTML(
                                vendor.contact
                            )}
                        </td>

                        <td>
                            ${POS.escapeHTML(
                                vendor.phone
                            )}
                        </td>

                        <td>
                            ${POS.escapeHTML(
                                vendor.email
                            )}
                        </td>

                        <td>
                            ${POS.escapeHTML(
                                vendor.supplyType
                            )}
                        </td>

                        <td>
                            ${POS.escapeHTML(
                                vendor.address
                            )}
                        </td>

                        <td>
                            ${vendor.date ? POS.formatDate(vendor.date) : "-"}
                        </td>

                        <td>

                            <button
                                class="btn-secondary"
                                data-admin-only
                                onclick="deleteVendor('${vendor.id}')">

                                Delete

                            </button>

                        </td>

                    `;


                            body.appendChild(row);

                        }
                    );

                }


                // ==================================
                // SAVE VENDOR
                // ==================================

                form.addEventListener(
                    "submit",
                    function (event) {

                        event.preventDefault();


                        const vendor = {

                            id:
                                "VEN-" +
                                Date.now(),

                            name:
                                document.getElementById(
                                    "vendor-name"
                                ).value.trim(),

                            contact:
                                document.getElementById(
                                    "vendor-contact"
                                ).value.trim(),

                            phone:
                                document.getElementById(
                                    "vendor-phone"
                                ).value.trim(),

                            email:
                                document.getElementById(
                                    "vendor-email"
                                ).value.trim(),

                            address:
                                document.getElementById(
                                    "vendor-address"
                                ).value.trim(),

                            supplyType:
                                document.getElementById(
                                    "vendor-product"
                                ).value,

                            date:
                                new Date().toISOString()

                        };


                        POS.addData(
                            "vendors",
                            vendor
                        );


                        form.reset();

                        formCard.style.display =
                            "none";

                        newVendorButton.style.display =
                            "inline-block";


                        displayVendors();

                    }
                );


                // ==================================
                // INITIAL DISPLAY
                // ==================================

                displayVendors();

            }
        );


        // ======================================
        // DELETE VENDOR
        // ======================================

        function deleteVendor(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this vendor?"
                );


            if (!confirmed) {
                return;
            }


            POS.deleteData(
                "vendors",
                id
            );


            location.reload();

        }

    </script>

</body>

</html>
